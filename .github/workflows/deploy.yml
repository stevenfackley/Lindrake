name: deploy

# ──────────────────────────────────────────────────────────────────────────────
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#
#   DEPLOY_HOST        — SSH hostname or IP of the production server
#   DEPLOY_USER        — SSH username (must be in the docker group)
#   DEPLOY_SSH_KEY     — PEM-encoded SSH private key (passphrase-free)
#   DEPLOY_WORK_DIR    — Absolute path on host where docker-compose files live
#                        e.g. /srv/lindrake
#
#   LINDRAKE_DB_URL_PROD — Npgsql connection string to qavren-db prod as role
#                        lindrake, over the Supavisor session pooler (port 5432,
#                        SSL Mode=Require). Written to
#                        secrets/ConnectionStrings__DefaultConnection.txt on
#                        every deploy. (A test environment would take
#                        LINDRAKE_DB_URL_TEST, qavren-db test, the same way;
#                        none is wired yet.)
#
# These secrets are ONLY needed for the `deploy` job (SSH step).
# The `build-push` job works without them — it uses only GITHUB_TOKEN.
#
# On the server, the following must be present before first deploy:
#   $DEPLOY_WORK_DIR/docker-compose.yml
#   $DEPLOY_WORK_DIR/docker-compose.prod.yml
#   $DEPLOY_WORK_DIR/.env.prod
#   $DEPLOY_WORK_DIR/secrets/*.txt    (populated from your secrets manager;
#                                      the connection string comes from
#                                      LINDRAKE_DB_URL_PROD, see above)
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: false
        default: "production"
        type: choice
        options: [production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel a running deploy

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/lindrake-web
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/lindrake-api

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Build and push both images to GHCR.
  # No live target needed — runs purely on GitHub-hosted runners.
  # ────────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    outputs:
      sha-tag: ${{ steps.meta.outputs.sha-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Emit the short SHA once; reuse in both image tags and the deploy job.
      - name: Compute tags
        id: meta
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha-tag=prod-${SHA}" >> "$GITHUB_OUTPUT"

      # ── Web image ──────────────────────────────────────────────────────────
      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Lindrake.Web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.sha-tag }}
          cache-from: type=gha,scope=web
          cache-to:   type=gha,scope=web,mode=max

      # ── API image ──────────────────────────────────────────────────────────
      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Lindrake.Api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.sha-tag }}
          cache-from: type=gha,scope=api
          cache-to:   type=gha,scope=api,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: SSH to production server and restart the stack.
  #
  # This job no-ops gracefully when DEPLOY_HOST is not set, so the workflow
  # can be merged and the build-push job exercised before infra is provisioned.
  #
  # NOTE: the "not ready yet" check can't live in this job's own `if:` —
  # referencing the `secrets` context in a job-level `if:` alongside this
  # job's `environment:` block is invalid and fails the entire workflow run
  # before any job (including build-push) is created. See PR #50/#55 history:
  # that's what caused main to go permanently red until the push trigger was
  # pulled. Check it in a step instead, where `secrets` is always valid.
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-push

    environment:
      name: production

    steps:
      - name: Check deploy target is configured
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          LINDRAKE_DB_URL: ${{ secrets.LINDRAKE_DB_URL_PROD }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_HOST not set — infra not provisioned yet, skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$LINDRAKE_DB_URL" ]; then
            echo "::error::LINDRAKE_DB_URL_PROD is not set: the API would start without a database."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # ssh-action forwards `envs` as `export NAME='value'` on the remote shell, so a
      # quote in the generated role password would break the hand-off. Base64 has
      # no shell metacharacters; the host decodes it. The encoded value is masked
      # so it cannot leak through step outputs or logs.
      - name: Encode the database connection string
        if: steps.check.outputs.ready == 'true'
        id: enc
        env:
          LINDRAKE_DB_URL: ${{ secrets.LINDRAKE_DB_URL_PROD }}
        run: |
          set -euo pipefail
          B64=$(printf '%s' "$LINDRAKE_DB_URL" | base64 -w0)
          echo "::add-mask::$B64"
          echo "b64=$B64" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.5
        env:
          LINDRAKE_DB_URL_B64: ${{ steps.enc.outputs.b64 }}
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          envs:     LINDRAKE_DB_URL_B64
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_WORK_DIR }}"

            # The API's database: qavren-db (schema lindrake) over the session
            # pooler. Rewritten every deploy so rotating LINDRAKE_DB_URL_PROD is
            # one secret update + one deploy. The API reads it from
            # /run/secrets/ConnectionStrings__DefaultConnection.
            mkdir -p secrets
            ( umask 077 && printf '%s' "$LINDRAKE_DB_URL_B64" | base64 -d > secrets/ConnectionStrings__DefaultConnection.txt )
            [ -s secrets/ConnectionStrings__DefaultConnection.txt ] || { echo "decoded connection string is empty"; exit 1; }

            # Pull the new images (tagged latest AND the immutable SHA tag)
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull web api

            # Restart web and api; the prod overlay has no db service (qavren-db)
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --no-deps --remove-orphans web api

            # Smoke-check: give the API 30 s to become healthy
            sleep 30
            docker compose ps
            echo "Deploy of ${{ needs.build-push.outputs.sha-tag }} complete."
