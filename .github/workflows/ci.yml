name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: stevenfackley/gh-actions/.github/workflows/ci-dotnet.yml@v1
    with:
      project-name: Lindrake
      # Not an AOT target (EF Core, Semantic Kernel, Swashbuckle; JIT aspnet image).
      # The reusable AOT lane fell back to the Blazor WASM csproj and failed NETSDK1203.
      aot-rid: ""
      # Real-Postgres integration lane (tests/Lindrake.IntegrationTests/Postgres):
      # the lane starts a Postgres service and exports ConnectionStrings__PostgreSQL
      # (superuser). pgvector image: the suite creates vector, pg_trgm, uuid-ossp.
      run-postgres: true
      postgres-image: pgvector/pgvector:pg16
    secrets: inherit
