# Production overlay — apply with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Needs Docker Compose 2.24.4 or later: the !override and !reset tags below
# replace or remove what the base (dev) file sets. Without them Compose merges
# (env_file lists are appended, port lists are merged, build is kept).
#
# What this overlay does on top of the base (docker-compose.yml):
#   - Removes the db service: the base file's Postgres is for local development
#     only. Production data lives in qavren-db (schema lindrake, role lindrake),
#     reached over the Supavisor session pooler; the api no longer depends on db
#   - Replaces every env_file with .env.prod alone: nothing from .env.dev
#     reaches production
#   - Replaces the api environment, so the base file's dev values (connection
#     string, JWT secret, API keys) are gone
#   - Removes build: runs the pre-built GHCR images (deploy.yml pulls them
#     before `up`)
#   - Publishes api and web on 127.0.0.1 only, for a reverse proxy on the same
#     host (see docs/DEPLOY.md, Ports)
#   - Injects secrets via Docker file-based secrets (see secrets/ directory)
#   - Adds healthchecks on api and web
#   - Enforces restart: always on every service
#
# Required files on the host before first deploy:
#   .env.prod               — non-secret settings (docs/DEPLOY.md, .env.prod).
#                             MUST set either Supabase__Url, or
#                             JWT__ALLOWLOCALIDENTITYPROVIDER=true
#                             (in-house HS256 provider, needs a unique 32+ byte
#                             Jwt__Secret): with neither, the API refuses to start
#                             in Production.
#   secrets/*.txt           — one file per secret, raw value, no trailing newline
#     Anthropic__ApiKey.txt
#     OpenAI__ApiKey.txt
#     Tavily__ApiKey.txt
#     Jwt__Secret.txt
#     ConnectionStrings__DefaultConnection.txt   (written by deploy.yml from the
#                             LINDRAKE_DB_URL_PROD GitHub secret: qavren-db over the
#                             session pooler, port 5432, SSL Mode=Require)
#
# GHCR image names (pushed by .github/workflows/deploy.yml):
#   ghcr.io/<owner>/lindrake-web:<tag>
#   ghcr.io/<owner>/lindrake-api:<tag>
# The deploy workflow uses the 'latest' tag by default.

services:
  # Local development only (docs/DEPLOY.md, Database): production uses qavren-db.
  db: !reset null

  api:
    # Pre-built image from GHCR; override with IMAGE_API / IMAGE_TAG env vars
    image: ${IMAGE_API:-ghcr.io/stevenfackley/lindrake-api}:${IMAGE_TAG:-latest}
    build: !reset null
    restart: always
    # The base file waits for its local db; production has none.
    depends_on: !reset {}
    env_file: !override
      - .env.prod
    ports: !override
      - "127.0.0.1:5000:8080"
    secrets:
      - Anthropic__ApiKey
      - OpenAI__ApiKey
      - Tavily__ApiKey
      - Jwt__Secret
      - ConnectionStrings__DefaultConnection
    environment: !override
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # qavren-db: the lindrake role's schema (its search_path is lindrake,
      # extensions); startup migrations refuse to run if the two disagree.
      Database__Schema: lindrake
      # Secrets are not env vars here: the API reads /run/secrets/ via
      # AddKeyPerFile (file name Section__Key -> config key Section:Key).
    healthcheck:
      # The aspnet:10.0 runtime image (Ubuntu 24.04) ships neither curl nor wget,
      # so probe GET /health over bash's /dev/tcp. Healthy = HTTP 200; /health
      # answers 503 when the database check fails.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '^HTTP/1\\.[01] 200'"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    # Pre-built image from GHCR. API_BASE_URL (from .env.prod) is rendered into
    # app/appsettings.json at container start. Unset or empty: the client calls
    # api/... on its own origin (reverse proxy in front).
    image: ${IMAGE_WEB:-ghcr.io/stevenfackley/lindrake-web}:${IMAGE_TAG:-latest}
    build: !reset null
    restart: always
    env_file: !override
      - .env.prod
    ports: !override
      - "127.0.0.1:5080:80"
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first and nginx.conf
      # only listens on IPv4 (listen 80), so "localhost" is refused.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/app/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# Docker file-based secrets.
# Each file must contain only the raw secret value (no trailing newline).
# In CI/CD, write these files from your secrets manager at deploy time.
secrets:
  Anthropic__ApiKey:
    file: ./secrets/Anthropic__ApiKey.txt
  OpenAI__ApiKey:
    file: ./secrets/OpenAI__ApiKey.txt
  Tavily__ApiKey:
    file: ./secrets/Tavily__ApiKey.txt
  Jwt__Secret:
    file: ./secrets/Jwt__Secret.txt
  ConnectionStrings__DefaultConnection:
    file: ./secrets/ConnectionStrings__DefaultConnection.txt
